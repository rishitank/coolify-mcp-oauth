# gitleaks configuration.
#
# The default ruleset flags the hardcoded encryption keys in test/ as
# `generic-api-key` on entropy alone. They are fixtures: the value in
# test/integration/dcr.test.js base64-decodes to the ASCII string
# "0123456789abcdef0123456789abcdef", a 32-byte dummy key chosen to be
# obviously fake while still being a valid AES-256 key length.
#
# This allowlist is scoped to test paths only. Source, config and CI are still
# scanned with the full default ruleset, and history is still scanned, so a
# real credential committed anywhere that matters still fails the build.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
description = "Test fixtures use deliberately fake, high-entropy constants"
paths = ['''^test/''']
